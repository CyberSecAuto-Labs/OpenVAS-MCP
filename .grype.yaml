# Per-CVE suppressions, for findings that need a case-by-case judgement and a
# tracking issue. CPython interpreter CVEs do not belong here — they are handled
# structurally by scripts/grype_gate.py, which drops findings whose only fixes
# land on a Python release line the image does not ship.
ignore:
  # jaraco.context is a transitive dep pulled in by mcp's dependency chain.
  # Pinning it in requirements.txt/pyproject.toml doesn't reliably override
  # transitive resolution. Track mcp upstream for a fix; ignore until resolved.
  # Re-evaluate: https://github.com/CyberSecAuto-Labs/OpenVAS-MCP/issues/19
  - vulnerability: GHSA-58pv-8j8x-9vj2
    package:
      name: jaraco-context
      type: python
